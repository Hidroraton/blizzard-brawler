<script>
(function () {
  const bar = document.getElementById('social-bar');
  if (!bar) return;
  const threshold = 200;

  function toggleBar() {
    if (window.scrollY > threshold) {
      bar.classList.add('visible');
    } else {
      bar.classList.remove('visible');
    }
  }

  window.addEventListener('scroll', toggleBar, { passive: true });
  toggleBar();
})();
</script>
